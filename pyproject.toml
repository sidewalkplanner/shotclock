[project]
name = "shotclock"
version = "0.1.0"
description = "A neutral feedback loop for local land use: case ledger, state rule library and statutory clocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "holidays>=0.60",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
shotclock = "shotclock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
