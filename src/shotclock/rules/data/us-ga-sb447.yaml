id: us-ga-sb447
state: GA
name: Georgia land-disturbance permit deadlines
citation: SB 447 (2026), LC 47 4324S as passed; O.C.G.A. 12-7-9, 12-7-11
effective_from: 2026-07-01
checks:
  - claim: The deadlines apply to land-disturbance permits under the Erosion and
      Sedimentation Act only, not to building permits
    status: corrected
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 79-81); 36-60-34(g) (sec. 5, lines 216-217)
    note: Summaries described a building-permit shot clock. New 36-60-34 adds transparency
      for building permits but says it does not alter review timelines.
  - claim: The permit must be issued or denied within 45 days of filing
    status: corrected
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 79-81)
    note: Was encoded as 45 days from the completeness determination; the text runs it from
      filing.
  - claim: Completeness and any external review are determined in the first 5 days after
      filing
    status: confirmed
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 81-85)
  - claim: Without a notice of incompleteness within 5 days, the application is deemed complete
    status: confirmed
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 85-87)
  - claim: After a denial or nonacceptance, the first resubmission is decided within 20 days
    status: confirmed
    cite: O.C.G.A. 12-7-9(c)(1) (SB 447 sec. 3, line 92)
  - claim: Each later resubmission is decided within 14 days
    status: confirmed
    cite: O.C.G.A. 12-7-9(c)(2) (SB 447 sec. 3, line 93)
  - claim: Reviews after a resubmission may only comment on the initial comments or on
      changes in the resubmission
    status: confirmed
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 94-97)
    note: Not encoded; would need comment content.
  - claim: A missed deadline requires refunding all fees collected for the application
    status: confirmed
    cite: O.C.G.A. 12-7-11(a) (SB 447 sec. 4, lines 125-128)
  - claim: An applicant may petition superior court for mandamus, with docket priority
    status: confirmed
    cite: O.C.G.A. 12-7-11(c) (SB 447 sec. 4, lines 154-156)
  - claim: Denials must state specific reasons, with a written list and supporting
      documentation, and rest only on an authorized legal basis
    status: confirmed
    cite: O.C.G.A. 12-7-11(a) (SB 447 sec. 4, lines 128-135)
  - claim: Developments of regional impact are excluded from the deadlines
    status: confirmed
    cite: O.C.G.A. 12-7-9(c) (SB 447 sec. 3, lines 97-99)
    note: Not encoded as a condition (cases rarely carry a DRI flag); exclude DRI cases in
      the mapping.
  - claim: Deadlines are tolled while a state agency conducts part of the review
    status: confirmed
    cite: O.C.G.A. 12-7-9(e) (SB 447 sec. 3, lines 105-110)
    note: Not encoded; needs an external-review event in the ledger.
  - claim: Related items the authority requires (storm water, utility approvals) are held to
      the same deadlines
    status: confirmed
    cite: O.C.G.A. 12-7-9(d) (SB 447 sec. 3, lines 100-104)
  - claim: A county meeting the airport description in 12-7-9(f), and each adjacent county,
      is exempt from the deadlines and mandamus unless a local Act approved by referendum
      opts in
    status: corrected
    cite: O.C.G.A. 12-7-9(f), 12-7-11(c) (SB 447 sec. 3, lines 111-119; sec. 4, lines 157-164)
    note: Summaries called it a Paulding exemption. Which counties qualify is a factual
      question the text does not answer; until settled, do not load an affected county's
      land-disturbance cases. The 36-60-34 transparency duty still applies there.
  - claim: In force for applications filed on or after 2026-07-01
    note: The bill has no effective-date section. Georgia's default (O.C.G.A. 1-3-4) is
      July 1 after approval, and the bill was reportedly signed May 11, 2026. Confirm.
  - claim: Day counts are calendar days
    note: The text says "days" in 12-7-9, while sec. 1 of the same Act says "business days"
      for private-provider inspections, which supports a calendar-day reading. Confirm with
      counsel or DCA guidance.
  - claim: Time an application spends with the applicant inside a review round does not count
    note: The text gives no pause apart from state-agency tolling; rounds end at denial or
      nonacceptance and restart at resubmission. Kept as a pause so an informal request for
      information does not count against the city; confirm.
  - claim: Material additions to a resubmission, or completing an application after an
      incompleteness notice, start a new 45-day application
    cite: O.C.G.A. 12-7-11(a) (SB 447 sec. 4, lines 136-142)
    note: Not encoded. Today an incomplete notice pauses the first round instead of
      restarting it.
sources:
  - SB 447 (2026), LC 47 4324S, as passed (text uploaded to the project)
applies_to:
  case_types: [land_disturbance]
day_basis: calendar
pause_when_applicant_holds: true
clocks:
  - id: completeness
    label: Completeness check
    start: [submitted]
    stop: [complete, incomplete]
    limit_days: 5
    remedy: Treat the application as complete (deemed complete, O.C.G.A. 12-7-9(c))
    remedy_after_late_days: 0
  - id: review
    label: Land-disturbance permit review
    kind: review_cycles
    start: [submitted]
    restart: [resubmitted]
    stop: [comments_issued, approved, denied]
    limit_days_by_cycle: [45, 20, 14]
penalty:
  summary: >
    Refund of all fees collected for the application (12-7-11(a)) and a mandamus petition
    with docket priority (12-7-11(c)). A missed completeness check means the application is
    deemed complete.
  remedy: Refund of all application fees; mandamus petition with docket priority
    (O.C.G.A. 12-7-11)
  remedy_after_late_days: 0
transparency: >
  O.C.G.A. 36-60-34: from 2028-01-01, a county, municipality or consolidated government that
  issued more than 250 building permits (land disturbance included) in the preceding
  calendar year must publish real-time status for every building permit application,
  searchable by permit number, address or parcel ID, with no charge or login.
